<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BG Remover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f4f4f4;
        color: #333;
        text-align: center;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 20px;
      }
        p {
            font-size: 1.2rem;
            margin-top: 20px;
        }
        input[type="file"] {
            margin-top: 20px;
            margin-left: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #resultContainer img{
            margin-top: 20px;
            max-width: 20rem;
            height: auto;
        }
        #downloadButton {
            display: none;
            margin-top: 20px;
            margin-left: 45rem;
        }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Background Remover</h1>
      <p>Upload an image to remove its background.</p>
      <input type="file" id="imageInput" accept="image/*" /></div><br>
      <button id="removeBgButton">Remove Background</button>
      <div id="resultContainer"></div>
      <button id="downloadButton">Download</button>
    </div>
    <script>
const button = document.getElementById("removeBgButton");

button.addEventListener("click", async () => {

    const fileInput = document.getElementById("imageInput");

    if (!fileInput.files.length) {
        alert("Select an image first");
        return;
    }

    const formData = new FormData();
    formData.append("image", fileInput.files[0]);

    const response = await fetch("/remove-bg", {
        method: "POST",
        body: formData
    });

    const blob = await response.blob();

    const img = document.createElement("img");
    img.src = URL.createObjectURL(blob);

    const container = document.getElementById("resultContainer");
    container.innerHTML = "";
    container.appendChild(img);

    const downloadButton = document.getElementById("downloadButton");
    downloadButton.style.display = "block";
    downloadButton.addEventListener("click", () => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "output.png";
        link.click();
    });
});
    </script>
  </body>
</html>
